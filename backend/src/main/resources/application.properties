spring.application.name=backend

# Base de datos (valores por defecto = docker-compose.yml; se sobreescriben con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ladorada}
spring.datasource.username=${DB_USER:ladorada}
spring.datasource.password=${DB_PASSWORD:ladorada}

# El esquema lo crea Flyway (db/migration); Hibernate solo valida que coincida
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${PORT:8080}
app.cors-origins=${CORS_ORIGINS:http://localhost:4200}

# Token de sesión (JWT). En producción definir JWT_SECRET con un valor propio de 32+ caracteres
app.jwt-secret=${JWT_SECRET:dev-secret-la-dorada-cambiar-en-produccion-0123456789}
app.jwt-horas=8
